# nginx: serve Velopack release folders over HTTPS.
#
# Layout: one folder per application under the root, filled by build/publish.ps1:
#   /srv/updates/sampleapp/releases.stable.json, SampleApp-1.0.1-stable-full.nupkg, ...
# Address given to the application (appsettings.json, UpdateChannel:FeedUrl):
#   https://updates.example.com/sampleapp/
#
# Install: copy this file to /etc/nginx/conf.d/updates.conf (or sites-available/), adapt server_name,
# the certificate paths and root, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name updates.example.com;

    # Updates travel over HTTPS only.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 or later: add "http2 on;" here (not needed for plain file downloads).
    server_name updates.example.com;

    ssl_certificate     /etc/letsencrypt/live/updates.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.example.com/privkey.pem;

    root /srv/updates;
    autoindex off;

    # Content types of the release files.
    types {
        application/json                              json;
        application/octet-stream                      nupkg;
        application/zip                               zip;
        application/vnd.microsoft.portable-executable exe;
        application/x-msi                             msi;
    }
    default_type application/octet-stream;

    # Hidden files, such as the temporary index written by build/publish.ps1 before its rename.
    location ~ /\. {
        return 404;
    }

    # Release index of each channel and other files that change at every release: always revalidated.
    # A cached index would hide a new version, or point to packages a cache no longer has.
    location ~ /(releases\.[^/]+\.json|assets\.[^/]+\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ /RELEASES-[^/]+$ {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Installer and portable archive: same name at every release, so revalidated too.
    location ~ -(Setup\.exe|Portable\.zip)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Packages: the version is in the name and a published file never changes, so cache them for a year.
    location ~ -(full|delta)\.nupkg$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # Only the release files are served; no directory listing.
        try_files $uri =404;
    }
}
