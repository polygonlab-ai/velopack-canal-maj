# Apache httpd 2.4: serve Velopack release folders over HTTPS.
#
# Layout: one folder per application under the root, filled by build/publish.ps1:
#   /srv/updates/sampleapp/releases.stable.json, SampleApp-1.0.1-stable-full.nupkg, ...
# Address given to the application (appsettings.json, UpdateChannel:FeedUrl):
#   https://updates.example.com/sampleapp/
#
# Needs mod_ssl, mod_headers and mod_mime (a2enmod ssl headers mime).
# Install: copy to /etc/apache2/sites-available/updates.conf, adapt ServerName, the certificate paths
# and the folder, then: a2ensite updates && apachectl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName updates.example.com
    # Updates travel over HTTPS only.
    Redirect permanent / https://updates.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName updates.example.com
    DocumentRoot /srv/updates

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/updates.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/updates.example.com/privkey.pem

    <Directory /srv/updates>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Content types of the release files.
    AddType application/json .json
    AddType application/octet-stream .nupkg
    AddType application/zip .zip
    AddType application/vnd.microsoft.portable-executable .exe
    AddType application/x-msi .msi
    <FilesMatch "^RELEASES-">
        ForceType "text/plain; charset=utf-8"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"

    # Hidden files, such as the temporary index written by build/publish.ps1 before its rename.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Release index of each channel, installer and portable archive: same name at every release,
    # so always revalidated. A cached index would hide a new version.
    <FilesMatch "^(releases\..+\.json|assets\..+\.json|RELEASES-.+|.+-Setup\.exe|.+-Portable\.zip)$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # Packages: the version is in the name and a published file never changes, so cache them for a year.
    <FilesMatch "-(full|delta)\.nupkg$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</VirtualHost>
